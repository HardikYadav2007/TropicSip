<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="50%" stop-color="#FF9800" />
      <stop offset="100%" stop-color="#FFC107" />
    </linearGradient>
    <linearGradient id="juiceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="100%" stop-color="#FF9100" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66BB6A" />
      <stop offset="100%" stop-color="#2E7D32" />
    </linearGradient>
    <filter id="glow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#5c1a00" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Rounded Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Tropical Fresh Leaf -->
  <path d="M37 11 C47 11 51 18 49 24 C41 24 37 19 37 11 Z" fill="url(#leafGrad)" />
  <path d="M37 11 C42 17 44 19 49 24" stroke="#A5D6A7" stroke-width="0.9" stroke-linecap="round" fill="none" opacity="0.6" />

  <!-- Bottle & Juice Container with Drop Shadow -->
  <g filter="url(#glow)">
    <!-- Cap -->
    <rect x="27.5" y="15" width="9" height="3.5" rx="1.2" fill="#ECEFF1" stroke="#CFD8DC" stroke-width="0.5" />
    
    <!-- Glass Bottle Body -->
    <path d="M29 18.5 L29 23 C29 26.5 24.5 28.5 24.5 32.5 L24.5 48.5 C24.5 51.5 26.5 53.5 29.5 53.5 L34.5 53.5 C37.5 53.5 39.5 51.5 39.5 48.5 L39.5 32.5 C39.5 28.5 35 26.5 35 23 L35 18.5 Z" fill="#FFFFFF" fill-opacity="0.96" />

    <!-- Rich Cold-Pressed Juice Fill -->
    <path d="M25.5 33.5 C27.5 32.5 31 34 34.5 33 C37 32 38.5 33 38.5 33.5 L38.5 48 C38.5 50.5 37 52.5 34.5 52.5 L29.5 52.5 C27 52.5 25.5 50.5 25.5 48 Z" fill="url(#juiceGrad)" />

    <!-- Vibrant Citrus Slice Badge -->
    <circle cx="32" cy="42" r="5" fill="#E65100" />
    <circle cx="32" cy="42" r="4.3" fill="#FB8C00" />
    <circle cx="32" cy="42" r="3.5" fill="#FFE082" />
    <!-- Citrus Segments -->
    <line x1="32" y1="38.8" x2="32" y2="45.2" stroke="#FB8C00" stroke-width="0.6" />
    <line x1="28.8" y1="42" x2="35.2" y2="42" stroke="#FB8C00" stroke-width="0.6" />
    <line x1="29.7" y1="39.7" x2="34.3" y2="44.3" stroke="#FB8C00" stroke-width="0.6" />
    <line x1="29.7" y1="44.3" x2="34.3" y2="39.7" stroke="#FB8C00" stroke-width="0.6" />
    <circle cx="32" cy="42" r="1.1" fill="#FFF8E1" />

    <!-- Glass Reflection Highlight -->
    <path d="M26.5 32 L26.5 47 C26.5 48.5 27 50 28 50.5" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.8" />
  </g>
</svg>
